<!DOCTYPE html>
<html>
<head>
  <title>Step to Star Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    .box { margin: 20px; }
    .balance-box {
      border: 2px solid #444;
      display: inline-block;
      padding: 15px;
      margin-top: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      width: 250px;
      margin-bottom: 30px;
    }
    #history, #stepsHistory {
      margin-top: 20px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    #history p { margin: 5px 0; font-size: 14px; }
    #stepsTotal { font-weight: bold; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #eee; }
    tr:nth-child(even) { background-color: #ffe6f0; }
    tr:nth-child(odd) { background-color: #e6f0ff; }
    .reward-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .reward-box {
      border: 2px solid #ccc;
      border-radius: 10px;
      width: 120px;
      padding: 15px;
      background-color: #fdfdfd;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .reward-box:hover {
      transform: scale(1.05);
      background-color: #f0f8ff;
    }
    .reward-box .emoji {
      font-size: 30px;
      margin-bottom: 8px;
    }
    .reward-box p { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>⭐ Step to Star Tracker ⭐</h1>
  
  <div class="box">
    <label>Select date:</label>
    <input type="date" id="dateInput">
  </div>
  
  <div class="box">
    <label>Enter steps:</label>
    <input type="number" id="stepsInput">
    <button onclick="convertSteps()">Convert to Stars</button>
  </div>
  
  <div class="balance-box">
    <h2>🌟 Star Balance</h2>
    <p id="stars">0</p>
  </div>
  
  <div class="reward-grid">
    <div class="reward-box" onclick="redeemReward(100)">
      <div class="emoji">✏️</div>
      <p>100 ⭐ Stationery</p>
    </div>
    <div class="reward-box" onclick="redeemReward(200)">
      <div class="emoji">🍫</div>
      <p>200 ⭐ Chocolate</p>
    </div>
    <div class="reward-box" onclick="redeemReward(300)">
      <div class="emoji">🧋</div>
      <p>300 ⭐ Milk Tea</p>
    </div>
    <div class="reward-box" onclick="redeemReward(400)">
      <div class="emoji">🍰</div>
      <p>400 ⭐ Dessert</p>
    </div>
    <div class="reward-box" onclick="redeemReward(500)">
      <div class="emoji">🍲</div>
      <p>500 ⭐ Mala Xiang Guo</p>
    </div>
  </div>
  
  <p id="rewardMessage"></p>
  
  <div id="history">
    <h3>📜 Star History</h3>
    <div id="historyLog"></div>
  </div>
  
  <div id="stepsHistory">
    <h3>🚶 Steps History (This Month)</h3>
    <div id="stepsLog"></div>
    <p id="stepsTotal">Total: 0 steps</p>
  </div>
  
  <script>
    let stars = 0;

    function addHistory(message) {
      let log = document.getElementById("historyLog");
      let entry = document.createElement("p");
      entry.textContent = message;
      log.prepend(entry);
    }

    function updateStepsHistory(data) {
      let stepsLog = document.getElementById("stepsLog");
      stepsLog.innerHTML = "";

      let table = document.createElement("table");
      let header = document.createElement("tr");
      header.innerHTML = "<th>Date</th><th>Steps</th>";
      table.appendChild(header);

      let totalSteps = 0;
      let totalStarsEarned = 0;
      let totalRewardsUsed = 0;
      let month = new Date().toISOString().slice(0,7);

      data.forEach(row => {
        if (!row.Steps) return; // Steps field holds the date/time in your JSON
        let entryMonth = String(row.Steps).slice(0,7);
        if (entryMonth === month) {
          let shortDate = String(row.Steps).split("T")[0];
          let tr = document.createElement("tr");
          tr.innerHTML = `<td>${shortDate}</td><td>${row.Reward}</td>`;
          table.appendChild(tr);

          totalSteps += parseInt(row.Reward || 0);
          totalStarsEarned += Math.floor((parseInt(row.Reward || 0)) / 50);

          if (row.Reward && String(row.Reward).includes("-star")) {
            let rewardValue = parseInt(row.Reward.split("-")[0]);
            totalRewardsUsed += rewardValue;
          }
        }
      });

      stepsLog.appendChild(table);
      document.getElementById("stepsTotal").textContent = `Total: ${totalSteps} steps`;

      let netBalance = totalStarsEarned - totalRewardsUsed;
      document.getElementById("stars").innerText = netBalance;
      stars = netBalance;
    }

    function loadStepsHistory() {
      fetch("https://script.google.com/macros/s/AKfycbyCg6MPxVydsaJyB5sAmdSRBKiCqgaHZIgQ1-Fl6lH8HriEmOrjNPUqEmD0MYlC7Tfe/exec")
        .then(response => response.json())
        .then(data => updateStepsHistory(data));
    }

    function convertSteps() {
      let steps = document.getElementById("stepsInput").value;
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      let earned = Math.floor(steps / 50);
      stars += earned;
      document.getElementById("stars").innerText = stars;
      
      addHistory(`+${earned} stars from ${steps} steps on ${date}`);
      
      saveData(date, steps, earned, "", stars);
      loadStepsHistory();
    }

    function redeemReward(amount) {
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      if (stars >= amount) {
        stars -= amount;
        document.getElementById("stars").innerText = stars;
        document.getElementById("rewardMessage").innerText = "🎉 You redeemed a " + amount + "-star reward!";
        
        addHistory(`-${amount} stars redeemed on ${date}`);
        
        saveData(date, 0, 0, amount + "-star reward", stars);
        loadStepsHistory();
      } else {
        document.getElementById("rewardMessage").innerText = "Not enough stars!";
      }
    }

    function saveData(date, steps, starsEarned, reward, balance) {
      fetch("https://script.google.com/macros/s/AKfycbyCg6MPxVydsaJyB5sAmdSRBKiCqgaHZIgQ1-Fl6lH8HriEmOrjNPUqEmD0MYlC7Tfe/exec", {
        method: "POST",
        body: JSON.stringify({ date: date, steps: steps, stars: starsEarned, reward: reward, balance: balance })
      })
      .then(response => response.text())
      .then(data => console.log(data));
    }

    window.onload = loadStepsHistory;
  </script>
</body>
</html>
