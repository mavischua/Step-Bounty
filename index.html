<!DOCTYPE html>
<html>
<head>
  <title>⭐ Step to Star Tracker ⭐</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    .box { margin: 20px; }
    .balance-box {
      border: 2px solid #444;
      display: inline-block;
      padding: 15px;
      margin-top: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      width: 250px;
      margin-bottom: 30px;
    }
    .reward-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .reward-box {
      border: 2px solid #ccc;
      border-radius: 10px;
      width: 120px;
      padding: 15px;
      background-color: #fdfdfd;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .reward-box:hover {
      transform: scale(1.05);
      background-color: #f0f8ff;
    }
    .reward-box .emoji {
      font-size: 30px;
      margin-bottom: 8px;
    }
    .reward-box p { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>⭐ Step to Star Tracker ⭐</h1>
  
  <div class="box">
    <label>Select date:</label>
    <input type="date" id="dateInput">
  </div>
  
  <div class="box">
    <label>Enter steps:</label>
    <input type="number" id="stepsInput">
    <button onclick="convertSteps()">Convert to Stars</button>
  </div>
  
  <div class="balance-box">
    <h2>🌟 Star Balance</h2>
    <p id="stars">0</p>
  </div>
  
  <div class="reward-grid">
    <div class="reward-box" onclick="redeemReward(100)">
      <div class="emoji">✏️</div>
      <p>100 ⭐ Stationery</p>
    </div>
    <div class="reward-box" onclick="redeemReward(200)">
      <div class="emoji">🍫</div>
      <p>200 ⭐ Chocolate</p>
    </div>
    <div class="reward-box" onclick="redeemReward(300)">
      <div class="emoji">🧋</div>
      <p>300 ⭐ Milk Tea</p>
    </div>
    <div class="reward-box" onclick="redeemReward(400)">
      <div class="emoji">🍰</div>
      <p>400 ⭐ Dessert</p>
    </div>
    <div class="reward-box" onclick="redeemReward(500)">
      <div class="emoji">🍲</div>
      <p>500 ⭐ Mala Xiang Guo</p>
    </div>
  </div>
  
  <p id="rewardMessage"></p>
  
  <script>
    let stars = 0;

    function updateStarBalance(data) {
      if (!Array.isArray(data) || data.length <= 1) {
        document.getElementById("stars").innerText = 0;
        return;
      }
      // skip header row
      const rows = data.slice(1);
      // latest balance from last row
      let latestBalance = parseInt(rows[rows.length - 1].balance || 0);
      document.getElementById("stars").innerText = latestBalance;
      stars = latestBalance;
      console.log("Latest balance:", latestBalance); // debug
    }

    function loadStarBalance() {
      fetch("https://script.google.com/macros/s/AKfycbxxDgztKv_DXSLBtJGksfxoyvykHB5SyCblq7QYmUZdzfmOHZAAROBgpWdvwvrkzeny/exec")
        .then(response => response.json())
        .then(data => updateStarBalance(data))
        .catch(err => console.error("Error loading balance:", err));
    }

    function convertSteps() {
      let steps = document.getElementById("stepsInput").value;
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      let earned = Math.floor(steps / 50);
      stars += earned;
      document.getElementById("stars").innerText = stars;
      saveData(date, steps, earned, "", stars);
      loadStarBalance();
    }

    function redeemReward(amount) {
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      if (stars >= amount) {
        stars -= amount;
        document.getElementById("stars").innerText = stars;
        document.getElementById("rewardMessage").innerText = "🎉 You redeemed a " + amount + "-star reward!";
        saveData(date, 0, 0, amount + "-star reward", stars);
        loadStarBalance();
      } else {
        document.getElementById("rewardMessage").innerText = "Not enough stars!";
      }
    }

    function saveData(date, steps, starsEarned, reward, balance) {
      fetch("https://script.google.com/macros/s/AKfycbxxDgztKv_DXSLBtJGksfxoyvykHB5SyCblq7QYmUZdzfmOHZAAROBgpWdvwvrkzeny/exec", {
        method: "POST",
        body: JSON.stringify({ date: date, steps: steps, stars: starsEarned, reward: reward, balance: balance })
      })
      .then(response => response.text())
      .then(data => console.log("Saved:", data));
    }

    window.onload = loadStarBalance;
  </script>
</body>
</html>
