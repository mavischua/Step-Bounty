<script>
  let stars = 0;

  function addHistory(message) {
    let log = document.getElementById("historyLog");
    let entry = document.createElement("p");
    entry.textContent = message;
    log.prepend(entry);
  }

  function updateStepsHistory(data) {
    let stepsLog = document.getElementById("stepsLog");
    stepsLog.innerHTML = "";

    if (!Array.isArray(data) || data.length <= 1) {
      stepsLog.innerHTML = "<p>No step history found.</p>";
      return;
    }

    // ✅ skip the first row (header row)
    const rows = data.slice(1);

    let table = document.createElement("table");
    let header = document.createElement("tr");
    header.innerHTML = "<th>Date</th><th>Steps</th><th>Stars Earned</th><th>Reward</th>";
    table.appendChild(header);

    let totalSteps = 0;
    let totalStars = 0;

    // track latest balance from the last row
    let latestBalance = parseInt(rows[rows.length - 1].balance || 0);

    const grouped = {};
    rows.forEach(row => {
      const dateRaw = row.date;
      const steps = parseInt(row.steps || 0);
      const starsEarned = parseInt(row.stars || 0);
      const reward = row.reward || "";

      // format date to YYYY-MM-DD only
      let date = dateRaw;
      if (dateRaw && dateRaw.includes("T")) {
        date = dateRaw.split("T")[0];
      }

      if (date) {
        if (!grouped[date]) {
          grouped[date] = { steps: 0, stars: 0, rewards: [] };
        }
        grouped[date].steps += steps;
        grouped[date].stars += starsEarned;
        if (reward) grouped[date].rewards.push(reward);
      }
    });

    for (const date in grouped) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${date}</td>
        <td>${grouped[date].steps}</td>
        <td>${grouped[date].stars}</td>
        <td>${grouped[date].rewards.join(", ")}</td>
      `;
      table.appendChild(tr);

      totalSteps += grouped[date].steps;
      totalStars += grouped[date].stars;
    }

    stepsLog.appendChild(table);
    document.getElementById("stepsTotal").textContent = `Total: ${totalSteps} steps, ${totalStars} stars earned`;

    // ✅ update star balance box
    document.getElementById("stars").innerText = latestBalance;
    stars = latestBalance;
  }

  function loadStepsHistory() {
    fetch("https://script.google.com/macros/s/AKfycbxxDgztKv_DXSLBtJGksfxoyvykHB5SyCblq7QYmUZdzfmOHZAAROBgpWdvwvrkzeny/exec")
      .then(response => response.json())
      .then(data => updateStepsHistory(data))
      .catch(err => console.error("Error loading steps:", err));
  }

  function convertSteps() {
    let steps = document.getElementById("stepsInput").value;
    let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
    let earned = Math.floor(steps / 50);
    stars += earned;
    document.getElementById("stars").innerText = stars;
    
    addHistory(`+${earned} stars from ${steps} steps on ${date}`);
    
    saveData(date, steps, earned, "", stars);
    loadStepsHistory();
  }

  function redeemReward(amount) {
    let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
    if (stars >= amount) {
      stars -= amount;
      document.getElementById("stars").innerText = stars;
      document.getElementById("rewardMessage").innerText = "🎉 You redeemed a " + amount + "-star reward!";
      
      addHistory(`-${amount} stars redeemed on ${date}`);
      
      saveData(date, 0, 0, amount + "-star reward", stars);
      loadStepsHistory();
    } else {
      document.getElementById("rewardMessage").innerText = "Not enough stars!";
    }
  }

  function saveData(date, steps, starsEarned, reward, balance) {
    fetch("https://script.google.com/macros/s/AKfycbxxDgztKv_DXSLBtJGksfxoyvykHB5SyCblq7QYmUZdzfmOHZAAROBgpWdvwvrkzeny/exec", {
      method: "POST",
      body: JSON.stringify({ date: date, steps: steps, stars: starsEarned, reward: reward, balance: balance })
    })
    .then(response => response.text())
    .then(data => console.log(data));
  }

  window.onload = loadStepsHistory;
</script>
