<script>
  let stars = 0;

  function addHistory(message) {
    let log = document.getElementById("historyLog");
    let entry = document.createElement("p");
    entry.textContent = message;
    log.prepend(entry);
  }

  function updateStepsHistory(data) {
    let stepsLog = document.getElementById("stepsLog");
    stepsLog.innerHTML = "";

    let table = document.createElement("table");
    let header = document.createElement("tr");
    header.innerHTML = "<th>Date</th><th>Steps</th>";
    table.appendChild(header);

    let totalSteps = 0;

    // Group steps by date
    const stepsByDate = {};
    data.forEach(row => {
      const date = row.date;
      const steps = parseInt(row.steps || 0);
      if (date && steps > 0) {
        if (!stepsByDate[date]) stepsByDate[date] = 0;
        stepsByDate[date] += steps;
      }
    });

    // Render grouped rows
    for (const date in stepsByDate) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${date}</td><td>${stepsByDate[date]}</td>`;
      table.appendChild(tr);
      totalSteps += stepsByDate[date];
    }

    stepsLog.appendChild(table);
    document.getElementById("stepsTotal").textContent = `Total: ${totalSteps} steps`;
  }

  function loadStepsHistory() {
    fetch("https://script.google.com/macros/s/AKfycbwey1lg1Hg2wDTgb5iiT0n1UtR1_F7Xw5y3OLZlWgAO7YmZ3psuSjgmzcsmncmWjP6Q/exec")
      .then(response => response.json())
      .then(data => updateStepsHistory(data));
  }

  function convertSteps() {
    let steps = document.getElementById("stepsInput").value;
    let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
    let earned = Math.floor(steps / 50);
    stars += earned;
    document.getElementById("stars").innerText = stars;
    
    addHistory(`+${earned} stars from ${steps} steps on ${date}`);
    
    saveData(date, steps, earned, "", stars);
    loadStepsHistory();
  }

  function redeemReward(amount) {
    let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
    if (stars >= amount) {
      stars -= amount;
      document.getElementById("stars").innerText = stars;
      document.getElementById("rewardMessage").innerText = "🎉 You redeemed a " + amount + "-star reward!";
      
      addHistory(`-${amount} stars redeemed on ${date}`);
      
      saveData(date, 0, 0, amount + "-star reward", stars);
      loadStepsHistory();
    } else {
      document.getElementById("rewardMessage").innerText = "Not enough stars!";
    }
  }

  function saveData(date, steps, starsEarned, reward, balance) {
    fetch("https://script.google.com/macros/s/AKfycbwey1lg1Hg2wDTgb5iiT0n1UtR1_F7Xw5y3OLZlWgAO7YmZ3psuSjgmzcsmncmWjP6Q/exec", {
      method: "POST",
      body: JSON.stringify({ date: date, steps: steps, stars: starsEarned, reward: reward, balance: balance })
    })
    .then(response => response.text())
    .then(data => console.log(data));
  }

  window.onload = loadStepsHistory;
</script>
