<!DOCTYPE html>
<html>
<head>
  <title>Step to Star Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    .box { margin: 20px; }
    .balance-box {
      border: 2px solid #444;
      display: inline-block;
      padding: 15px;
      margin-top: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      width: 250px;
    }
    #history, #stepsHistory {
      margin-top: 20px;
      text-align: left;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    #history p { margin: 5px 0; font-size: 14px; }
    #stepsTotal { font-weight: bold; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #eee; }
    tr:nth-child(even) { background-color: #ffe6f0; } /* pastel pink */
    tr:nth-child(odd) { background-color: #e6f0ff; } /* pastel blue */
    .reward-images {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .reward-images div { text-align: center; width: 120px; font-size: 20px; }
  </style>
</head>
<body>
  <h1>⭐ Step to Star Tracker ⭐</h1>
  
  <!-- Date picker -->
  <div class="box">
    <label>Select date:</label>
    <input type="date" id="dateInput">
  </div>
  
  <!-- Steps input -->
  <div class="box">
    <label>Enter steps:</label>
    <input type="number" id="stepsInput">
    <button onclick="convertSteps()">Convert to Stars</button>
  </div>
  
  <!-- Star Balance Box -->
  <div class="balance-box">
    <h2>🌟 Star Balance</h2>
    <p id="stars">0</p>
  </div>
  
  <!-- Reward emojis -->
  <div class="reward-images">
    <div>✏️<br>100 ⭐ Stationery</div>
    <div>🍫<br>200 ⭐ Chocolate</div>
    <div>🧋<br>300 ⭐ Milk Tea</div>
    <div>🍰<br>400 ⭐ Dessert</div>
    <div>🍲<br>500 ⭐ Mala Xiang Guo</div>
  </div>
  
  <!-- Rewards -->
  <div class="box">
    <button onclick="redeemReward(100)">Redeem 100-Star Reward</button>
    <button onclick="redeemReward(200)">Redeem 200-Star Reward</button>
    <button onclick="redeemReward(300)">Redeem 300-Star Reward</button>
    <button onclick="redeemReward(400)">Redeem 400-Star Reward</button>
    <button onclick="redeemReward(500)">Redeem 500-Star Reward</button>
    <p id="rewardMessage"></p>
  </div>
  
  <!-- History log -->
  <div id="history">
    <h3>📜 Star History</h3>
    <div id="historyLog"></div>
  </div>
  
  <!-- Steps history -->
  <div id="stepsHistory">
    <h3>🚶 Steps History (This Month)</h3>
    <div id="stepsLog"></div>
    <p id="stepsTotal">Total: 0 steps</p>
  </div>
  
  <script>
    let stars = 0;

    function addHistory(message) {
      let log = document.getElementById("historyLog");
      let entry = document.createElement("p");
      entry.textContent = message;
      log.prepend(entry);
    }

    function updateStepsHistory(data) {
      let stepsLog = document.getElementById("stepsLog");
      stepsLog.innerHTML = "";

      let table = document.createElement("table");
      let header = document.createElement("tr");
      header.innerHTML = "<th>Date</th><th>Steps</th>";
      table.appendChild(header);

      let total = 0;
      let month = new Date().toISOString().slice(0,7); // YYYY-MM

      data.forEach(row => {
        if (!row.date) return;
        let entryMonth = String(row.date).slice(0,7);
        if (entryMonth === month) {
          let shortDate = String(row.date).split("T")[0];
          let tr = document.createElement("tr");
          tr.innerHTML = `<td>${shortDate}</td><td>${row.steps}</td>`;
          table.appendChild(tr);
          total += parseInt(row.steps || 0);
        }
      });

      stepsLog.appendChild(table);
      document.getElementById("stepsTotal").textContent = `Total: ${total} steps`;
    }

    function loadStepsHistory() {
      fetch("https://script.google.com/macros/s/AKfycbxslnBBUyS61HPGg7IXIKMFCVeDO9Rj3DE-Yv4KcnxqlDt_Y0u9U21CQYelyTtA6mF7/exec")
        .then(response => response.json())
        .then(data => updateStepsHistory(data));
    }

    function convertSteps() {
      let steps = document.getElementById("stepsInput").value;
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      let earned = Math.floor(steps / 50);
      stars += earned;
      document.getElementById("stars").innerText = stars;
      
      addHistory(`+${earned} stars from ${steps} steps on ${date}`);
      
      saveData(date, steps, earned, "", stars);
      loadStepsHistory();
    }

    function redeemReward(amount) {
      let date = document.getElementById("dateInput").value || new Date().toISOString().split("T")[0];
      if (stars >= amount) {
        stars -= amount;
        document.getElementById("stars").innerText = stars;
        document.getElementById("rewardMessage").innerText = "🎉 You redeemed a " + amount + "-star reward!";
        
        addHistory(`-${amount} stars redeemed on ${date}`);
        
        saveData(date, 0, 0, amount + "-star reward", stars);
        loadStepsHistory();
      } else {
        document.getElementById("rewardMessage").innerText = "Not enough stars!";
      }
    }

    function saveData(date, steps, starsEarned, reward, balance) {
      fetch("https://script.google.com/macros/s/AKfycbxslnBBUyS61HPGg7IXIKMFCVeDO9Rj3DE-Yv4KcnxqlDt_Y0u9U21CQYelyTtA6mF7/exec", {
        method: "POST",
        body: JSON.stringify({ date: date, steps: steps, stars: starsEarned, reward: reward, balance: balance })
      })
      .then(response => response.text())
      .then(data => console.log(data));
    }

    window.onload = loadStepsHistory;
  </script>
</body>
</html>
